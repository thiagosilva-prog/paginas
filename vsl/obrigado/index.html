<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pagamento confirmado — LexControl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-app:#0C111A;
    --text-primary:#FFFFFF;
    --text-secondary:#8A9BB0;
    --text-muted:#5A6A7E;
    --accent-teal:#00E5CC;
    --accent-blue:#3B82F6;
    --accent-blue-dim:#1D65D8;
    --border-default:rgba(255,255,255,0.07);
    --border-strong:rgba(255,255,255,0.12);
    --glass-bg:rgba(19,29,40,0.55);
    --glass-border:rgba(255,255,255,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg-app);
    color:var(--text-primary);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:460px;
    width:100%;
    text-align:center;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:48px 32px;
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
  }
  .check{
    width:72px;height:72px;border-radius:999px;
    background:linear-gradient(to top,var(--accent-blue),#5a9bff);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;
    box-shadow:0 8px 28px -8px rgba(59,130,246,0.7);
  }
  .check svg{width:34px;height:34px;}
  h1{font-size:24px;font-weight:800;margin-bottom:12px;}
  p{color:var(--text-secondary);font-size:15px;line-height:1.6;margin-bottom:8px;}
  .plan-tag{
    display:inline-block;margin:16px auto 0;padding:6px 14px;
    border:1px solid var(--border-strong);border-radius:999px;
    font-size:12px;color:var(--accent-teal);font-weight:600;letter-spacing:.02em;
  }
  .back{
    display:block;margin-top:28px;color:var(--text-muted);
    font-size:13px;text-decoration:none;border-bottom:1px solid transparent;
  }
  .back:hover{color:var(--text-secondary);border-color:var(--text-secondary);}
</style>
</head>
<body>

  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Pagamento confirmado!</h1>
    <p>Recebemos sua assinatura do LexControl. Nossa equipe vai entrar em contato em breve para liberar seu acesso à plataforma.</p>
    <p>Fique de olho no seu e-mail e WhatsApp nas próximas horas.</p>
    <div id="planTag" class="plan-tag" style="display:none;"></div>
    <a class="back" href="/">Voltar para o site</a>
  </div>

<script>
(function(){
  var PLANS = {
    mensal:    { label: 'Plano Mensal',    value: 497   },
    semestral: { label: 'Plano Semestral', value: 2382  },
    anual:     { label: 'Plano Anual',     value: 3564  }
  };
  var params = new URLSearchParams(window.location.search);
  var plano = params.get('plano');
  var info = PLANS[plano];

  if(info){
    var tag = document.getElementById('planTag');
    tag.textContent = info.label;
    tag.style.display = 'inline-block';
  }

  if(typeof fbq === 'function'){
    fbq('track', 'Purchase', {
      value: info ? info.value : 0,
      currency: 'BRL',
      content_name: info ? ('LexControl - ' + plano) : 'LexControl',
      content_category: plano || 'desconhecido'
    });
  }
})();
</script>

</body>
</html>
