<html lang="pt-BR">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Pagamento confirmado — LexControl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-app:#0C111A;
    --text-primary:#FFFFFF;
    --text-secondary:#8A9BB0;
    --text-muted:#5A6A7E;
    --accent-teal:#00E5CC;
    --accent-blue:#3B82F6;
    --accent-blue-dim:#1D65D8;
    --border-default:rgba(255,255,255,0.07);
    --border-strong:rgba(255,255,255,0.12);
    --glass-bg:rgba(19,29,40,0.55);
    --glass-border:rgba(255,255,255,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg-app);
    color:var(--text-primary);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    max-width:460px;
    width:100%;
    text-align:center;
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:48px 32px;
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
  }
  .check{
    width:72px;height:72px;border-radius:999px;
    background:linear-gradient(to top,var(--accent-blue),#5a9bff);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;
    box-shadow:0 8px 28px -8px rgba(59,130,246,0.7);
  }
  .check svg{width:34px;height:34px;}
  h1{font-size:24px;font-weight:800;margin-bottom:12px;}
  p{color:var(--text-secondary);font-size:15px;line-height:1.6;margin-bottom:8px;}
  .back{
    display:block;margin-top:28px;color:var(--text-muted);
    font-size:13px;text-decoration:none;border-bottom:1px solid transparent;
  }
  .back:hover{color:var(--text-secondary);border-color:var(--text-secondary);}
  .wa-btn{
    display:inline-flex;align-items:center;gap:8px;margin-top:24px;
    background:var(--accent-teal);color:#0C111A;text-decoration:none;
    font-weight:700;font-size:14px;padding:13px 24px;border-radius:10px;
  }
  .spinner{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.15);border-top-color:var(--accent-teal);
    margin:20px auto 0;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Pagamento confirmado!</h1>
    <p>Recebemos sua assinatura do LexControl. Estamos te redirecionando para o WhatsApp para dar continuidade à liberação do seu acesso.</p>
    <div class="spinner"></div>
    <br>
    <a href="#" id="waLink" class="wa-btn">Continuar no WhatsApp</a>
    <a class="back" href="/">Voltar para o site</a>
  </div>

<script>
(function(){
  var WHATS_PHONE = '5592995060144';

  if(typeof fbq === 'function'){
    fbq('track', 'Purchase', { content_name: 'LexControl - Lastlink' });
    fbq('trackCustom', 'Pag_obg_control');
  }

  var mensagem = 'Olá! Acabei de assinar o LexControl e queria dar continuidade à liberação do meu acesso.';
  var waUrl = 'https://wa.me/' + WHATS_PHONE + '?text=' + encodeURIComponent(mensagem);

  document.getElementById('waLink').href = waUrl;

  setTimeout(function(){
    window.location.href = waUrl;
  }, 1200);
})();
</script>

</body>
</html>
